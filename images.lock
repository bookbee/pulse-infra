# ─── NOT pinned: pulse-gateway ───────────────────────────────────────────────
# The gateway is built from source at ../pulse-gateway using that repo's own
# Dockerfile (added 2026-09-13). It is therefore the
# one component whose bytes are NOT reproducible from this file — it follows
# whatever commit is checked out in the sibling repo. Its base images:
#   golang:1.26-alpine  (build stage)
#   alpine:3.21         (runtime stage)
# Those are tag-pinned, not digest-pinned, because they are rebuilt locally
# rather than pulled as the artifact. If the gateway's build output ever needs to
# be reproducible, the fix is a Dockerfile and a published image in that repo —
# not more pinning here.
