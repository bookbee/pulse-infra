# pulse-infra — pinned container images
#
# Every image in the stack is pinned by DIGEST, not tag. A tag is a moving
# pointer; a digest is the bytes. Reproducibility is this repo's highest-value
# property, and a tag silently re-pushed upstream is the most common way a
# "works on my machine" local stack starts differing between laptops.
#
# These are MANIFEST-LIST digests (OCI image index), not platform-specific ones.
# That matters: a per-platform digest resolved on an arm64 laptop cannot be
# pulled on amd64. Each entry below was verified to carry both linux/amd64 and
# linux/arm64.
#
# Resolved:      2026-09-12
# Resolved on:   Darwin arm64 (Apple Silicon), Docker 29.7.2
# Verified arch: linux/arm64 — full stack pulled, run and verified
#                linux/amd64 — present in every index above; pulled and executed
#                              under emulation (redis reports x86_64 and starts).
#                              NOT yet verified on a native amd64 host: nobody has
#                              run `make up && make verify` there. Do that before
#                              calling amd64 supported.
#
# Note: `docker pull --platform linux/amd64 <image>@<digest>` fails locally with
# "cannot overwrite digest" once the arm64 variant is cached under that same
# digest reference. That is a local image-store limitation, not a problem with
# the pin — pull by tag, or use a clean store, to inspect the other arch.
#
# ─── Bump procedure (deliberate, never automatic) ────────────────────────────
#   1. ./bootstrap/resolve-digests.sh          # reports drift, writes nothing
#   2. Edit BOTH this file and compose/compose.yaml — the digest appears in each
#   3. make reset && make up && make verify
#   4. Commit the digest change on its own, with the resolution date updated
#
# Never bump an image as a side effect of another change. If a pull fails
# because upstream removed a digest, that is a decision to make, not a thing to
# paper over by reverting to a tag.

# ─── Kafka ───────────────────────────────────────────────────────────────────
# KRaft mode, no ZooKeeper. The official Apache image: multi-arch, and its KRaft
# support is first-class rather than bolted on.
