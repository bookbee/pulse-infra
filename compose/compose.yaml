# pulse-infra — local development stack
#
# LOCAL DEVELOPMENT ONLY. Not staging, not production. See docs/divergences.md.
#
# THIS FILE RUNS BACKING SERVICES ONLY. No consumer project is built, started or
# configured here — they run their own containers and connect in. What gets
# provisioned comes from registry/dependencies.tsv, where projects register it.
#
# Images are pinned by manifest-list digest (multi-arch: linux/amd64 + linux/arm64).
# Digests and their resolution date live in ../images.lock — bump them there, deliberately.
#
# Profiles:
#   core  Kafka cluster (3 brokers) + fake-gcs-server       — the ingestor's world
#   full  every backing service: Kafka + Redis + fake-gcs   — what consumers connect to
#   lite  single-broker Kafka + fake-gcs-server             — low-resource fallback
#
# lite and core/full share host ports and MUST NOT run simultaneously. `make reset`
# between profile switches.

name: pulse-infra

x-kafka-image: &kafka-image
  image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837

# Settings identical across every broker in the 3-node cluster.
x-kafka-cluster-env: &kafka-cluster-env
  CLUSTER_ID: OxPnkSDZTdOzZy0VFXwmYg
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # RF=3 with min.insync.replicas=2 is what makes "kill one broker, stays writable"
  # a real test. min.insync.replicas=3 would make the cluster unwritable on one loss.
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_NUM_PARTITIONS: "6"
  # Off deliberately: topics are contract, not a side effect of a typo'd producer.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  # 0 makes consumer-group rebalances immediate and therefore observable.
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_RETENTION_HOURS: "24"
  KAFKA_HEAP_OPTS: -Xmx512m -Xms512m

x-kafka-healthcheck: &kafka-healthcheck
  # Per-broker liveness. Cluster-level readiness (all brokers in metadata + a topic
  # can actually be created) is the bootstrap gate's job — see bootstrap/wait-for-cluster.sh.
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 30s

services:
  # ─── Kafka: 3-broker KRaft cluster (no ZooKeeper) ──────────────────────────
  kafka-1:
    <<: *kafka-image
    container_name: pulse-kafka-1
    profiles: [core, full]
    ports: ["19092:19092"]
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes: ["kafka-1-data:/var/lib/kafka/data"]
    # F-013 (same class of bug as the gateway): a broker needs time for
    # controlled shutdown — leadership migration and a clean log flush. Measured
    # 3.4s on an idle cluster, which is already at the implicit default, and it
    # grows with partition count and load. A SIGKILLed broker restarts with an
    # unclean shutdown and rescans its logs; with min.insync.replicas=2 it also
    # leaves partitions under-replicated for longer than necessary.
    stop_grace_period: 30s
    healthcheck: *kafka-healthcheck
    networks: [pulse]

  kafka-2:
    <<: *kafka-image
    container_name: pulse-kafka-2
    profiles: [core, full]
    ports: ["19093:19093"]
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:19093
    volumes: ["kafka-2-data:/var/lib/kafka/data"]
    # Controlled shutdown headroom — see kafka-1 (F-013).
    stop_grace_period: 30s
    healthcheck: *kafka-healthcheck
    networks: [pulse]

  kafka-3:
    <<: *kafka-image
    container_name: pulse-kafka-3
    profiles: [core, full]
    ports: ["19094:19094"]
    environment:
      <<: *kafka-cluster-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:19094
    volumes: ["kafka-3-data:/var/lib/kafka/data"]
    # Controlled shutdown headroom — see kafka-1 (F-013).
    stop_grace_period: 30s
    healthcheck: *kafka-healthcheck
    networks: [pulse]

  # ─── Kafka: single broker, `lite` profile only ─────────────────────────────
  # No rebalancing, no ISR behaviour, RF=1. See docs/divergences.md.
  kafka-lite:
    <<: *kafka-image
    container_name: pulse-kafka-lite
    profiles: [lite]
    ports: ["19092:19092"]
    environment:
      CLUSTER_ID: OxPnkSDZTdOzZy0VFXwmYg
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-lite:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-lite:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes: ["kafka-lite-data:/var/lib/kafka/data"]
    # Controlled shutdown headroom — see kafka-1 (F-013).
    stop_grace_period: 30s
    healthcheck: *kafka-healthcheck
    networks: [pulse]

  # ─── fake-gcs-server: GCS staging stand-in ─────────────────────────────────
  # HTTP, not HTTPS: the self-signed cert would need trust-store work in Rust,
  # Java, Go and Node. Consumers point STORAGE_EMULATOR_HOST here. Unauthenticated.
  #
  # No stop_grace_period (F-013 review): it writes each object synchronously and
  # holds nothing to flush at shutdown — measured 0.3s, exit 0. The one-shot
  # bootstrap services are likewise exempt: they exit on their own, and stopping
  # one mid-run loses nothing that the next `make up` does not redo.
  fake-gcs:
    image: fsouza/fake-gcs-server@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    container_name: pulse-fake-gcs
    profiles: [core, full, lite]
    command:
      - -scheme=http
      - -port=4443
      - -public-host=fake-gcs:4443
      - -backend=filesystem
      - -filesystem-root=/data
      - -log-level=warn
    ports: ["4443:4443"]
    volumes: ["fake-gcs-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4443/storage/v1/b?project=pulse-local >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [pulse]

  # ─── Redis: queue backend for whoever registers keys against it ────────────
  # noeviction is load-bearing, and it is a promise to the owners of those keys:
  # writes fail loudly rather than keys being evicted out from under a consumer.
  # Changing it changes their error model, so it is contract. See the Redis
  # section of docs/stack-contract.md.
  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: pulse-redis
    profiles: [full]
    command:
      - redis-server
      - --requirepass
      - pulse-local-not-a-secret
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    # F-013: with appendonly on, SIGTERM makes Redis flush the AOF before
    # exiting. Measured 0.4s at this data size, so the implicit default is not
    # currently binding — but this is the container holding everything a
    # producer just worked to drain into it, and the cost of being explicit is
    # zero. 15s is ample for a 512mb cap.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a pulse-local-not-a-secret ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s
    networks: [pulse]

  # ─── Cluster readiness gate + bootstrap (core/full) ────────────────────────
  # Creates topics and the staging bucket. Idempotent: re-running is a no-op.
  # Nothing downstream starts until this exits 0.
  bootstrap:
    <<: *kafka-image
    container_name: pulse-bootstrap
    profiles: [core, full]
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
      fake-gcs: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      EXPECTED_BROKERS: "3"
      TOPIC_PARTITIONS: "6"
      TOPIC_REPLICATION_FACTOR: "3"
      TOPIC_MIN_INSYNC_REPLICAS: "2"
      GCS_ENDPOINT: http://fake-gcs:4443
    # WHAT to provision comes from the registry, not from this file: consumer
    # projects declare their topics and buckets there. See ../registry/dependencies.tsv.
    volumes: ["../bootstrap:/bootstrap:ro", "../registry:/registry:ro"]
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    restart: "no"
    networks: [pulse]

  # ─── Cluster readiness gate + bootstrap (lite) ─────────────────────────────
  bootstrap-lite:
    <<: *kafka-image
    container_name: pulse-bootstrap-lite
    profiles: [lite]
    depends_on:
      kafka-lite: {condition: service_healthy}
      fake-gcs: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka-lite:9092
      EXPECTED_BROKERS: "1"
      TOPIC_PARTITIONS: "6"
      TOPIC_REPLICATION_FACTOR: "1"
      TOPIC_MIN_INSYNC_REPLICAS: "1"
      GCS_ENDPOINT: http://fake-gcs:4443
    # WHAT to provision comes from the registry, not from this file: consumer
    # projects declare their topics and buckets there. See ../registry/dependencies.tsv.
    volumes: ["../bootstrap:/bootstrap:ro", "../registry:/registry:ro"]
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap.sh"]
    restart: "no"
    networks: [pulse]

# ─── Extension point: Iceberg REST catalog (silver) ──────────────────────────
# Deliberately not built. Silver is out of the local loop: the silver worker
# reads GCS staging and writes Iceberg, and neither is exercised locally.
# When it comes in scope, it belongs here as its own profile — not in `full`.

networks:
  pulse:
    name: pulse-infra

volumes:
  kafka-1-data: {name: pulse-infra-kafka-1-data}
  kafka-2-data: {name: pulse-infra-kafka-2-data}
  kafka-3-data: {name: pulse-infra-kafka-3-data}
  kafka-lite-data: {name: pulse-infra-kafka-lite-data}
  fake-gcs-data: {name: pulse-infra-fake-gcs-data}
  redis-data: {name: pulse-infra-redis-data}
